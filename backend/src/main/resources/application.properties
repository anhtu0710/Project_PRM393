# ===== Server =====
server.port=${PORT:8080}
server.servlet.context-path=/api

# ===== Datasource (Auto-detects SPRING_DATASOURCE_URL, DATABASE_URL, or defaults to local SQL Server) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:sqlserver://localhost:1433;databaseName=GenzCinemaHotel;encrypt=true;trustServerCertificate=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}

# ===== JPA/Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

