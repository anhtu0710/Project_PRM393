# ===== Server (Dynamically bind to Render's $PORT or default to 8080) =====
server.port=${PORT:8080}
server.servlet.context-path=/api

# ===== Datasource (Auto-detect Driver & Dialect based on JDBC URL) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GenzCinemaHotel;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123

# ===== JPA/Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

